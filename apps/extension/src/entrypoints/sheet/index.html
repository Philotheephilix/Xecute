<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Brand: /brand/xecute-icon.svg -->
    <title>Xecute</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 380px;
        height: 580px;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, sans-serif;
        background: var(--bg-warm);
        color: #111111;
        overflow: hidden;
      }

      :root {
        --orange: #ef7b28;
        --orange-dark: #ed7725;
        --orange-light: #FFB56B;
        --teal: #29ceb4;
        --purple: #9662FF;
        --purple-light: #CA82FF;
        --bg-warm: #faf9f6;
        --border-dark: #111111;
        --card-yellow: #FFE775;
        --card-green: #44C760;
        --card-blue: #58A3F5;
      }

      /* Neo-Brutalist Hard Shadows */
      .shadow-neo {
        box-shadow: 0px 4px 0px #111111;
      }
      .shadow-neo-sm {
        box-shadow: 0px 2.5px 0px #111111;
      }
      .shadow-neo-lg {
        box-shadow: 0px 5px 0px #111111;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .screen {
        transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.35s ease;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        background-color: var(--bg-warm);
      }
      .screen-enter-right {
        transform: translateX(100%);
        opacity: 0;
      }
      .screen-enter-left {
        transform: translateX(-100%);
        opacity: 0;
      }
      .screen-active {
        transform: translateX(0%);
        opacity: 1;
        z-index: 10;
      }
      .screen-exit-left {
        transform: translateX(-30%);
        opacity: 0;
      }
      .screen-exit-right {
        transform: translateX(30%);
        opacity: 0;
      }

      #app-root {
        position: relative;
        width: 380px;
        height: 580px;
        background: var(--bg-warm);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .btn-neo {
        border: 2px solid #111111;
        border-radius: 13px;
        box-shadow: 0px 4px 0px #111111;
        font-family: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        background: none;
      }
      .btn-neo:active {
        transform: translateY(3px);
        box-shadow: 0px 1px 0px #111111;
      }

      .btn-back {
        width: 42px;
        height: 42px;
        background: white;
        border: 2px solid #111111;
        border-radius: 13px;
        box-shadow: 0px 2.5px 0px #111111;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }
      .btn-back:active {
        transform: translateY(2px);
        box-shadow: 0px 0.5px 0px #111111;
      }

      .toggle-track {
        position: relative;
        width: 48px;
        height: 26px;
        background: #d1d5db;
        border: 2px solid #111111;
        border-radius: 13px;
        cursor: pointer;
        transition: background 0.2s ease;
        flex-shrink: 0;
      }
      .toggle-track.on {
        background: var(--teal);
      }
      .toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        background: white;
        border: 1.5px solid #111111;
        border-radius: 50%;
        transition: transform 0.2s ease;
      }
      .toggle-track.on .toggle-thumb {
        transform: translateX(22px);
      }

      /* Dock pill morphing from design.html */
      .dock-pill {
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes floatBadge {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .animate-float {
        animation: floatBadge 3.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="app-root">
      <div id="react-root" style="position: relative; flex: 1; overflow: hidden;"></div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
