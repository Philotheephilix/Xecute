<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 60" width="192" height="60" fill="none">
  <defs>
    <linearGradient id="xecute-orange" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5882E" />
      <stop offset="100%" stop-color="#EA6B19" />
    </linearGradient>
  </defs>

  <!-- Hard Neo-Brutalist Shadow -->
  <rect x="4" y="8" width="48" height="48" rx="13" fill="#111111" />

  <!-- Icon Badge -->
  <rect x="4" y="4" width="48" height="48" rx="13" fill="url(#xecute-orange)" stroke="#111111" stroke-width="2.5" />

  <!-- Minimal Execution 'X' Mark (Mirrored Command Chevrons) -->
  <path d="M18 19L26.5 28L18 37" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M38 19L29.5 28L38 37" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wordmark -->
  <text x="65" y="38" fill="#111111" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="30" letter-spacing="-1.2">Xecute</text>

  <!-- Mint Accent Dot -->
  <circle cx="171" cy="34" r="4.5" fill="#33C2AC" stroke="#111111" stroke-width="2" />
</svg>
