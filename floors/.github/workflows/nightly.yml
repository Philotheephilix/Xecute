name: nightly
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: floors
          POSTGRES_PASSWORD: floors
          POSTGRES_DB: floors
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: floors/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: floors

      - name: Start near-sandbox
        run: |
          docker run -d --name near-sandbox \
            -p 3030:3030 \
            -v "${{ github.workspace }}/floors/infra/sandbox:/root/.near-config:ro" \
            nearprotocol/near-sandbox:latest \
            sh -c "
              if [ ! -f /root/.near/node_key.json ]; then
                neard --home /root/.near init --chain-id localnet;
              fi;
              if [ -f /root/.near-config/genesis.json ]; then
                cp /root/.near-config/genesis.json /root/.near/genesis.json;
              fi;
              exec neard --home /root/.near run
            "

      - name: Wait for near-sandbox
        run: |
          timeout 60 sh -c 'until curl -sf http://localhost:3030/status; do sleep 2; done'
        timeout-minutes: 2

      - name: Setup sandbox accounts
        run: pnpm exec tsx scripts/setup-sandbox.ts
        working-directory: floors

      - name: Build all services
        run: |
          pnpm --filter "@floors/shared-server" build
          pnpm --filter "@floors/api" build
          pnpm --filter "@floors/relayer" build
        working-directory: floors

      - name: Build extension
        run: pnpm --filter "@floors/extension" build
        working-directory: floors

      - name: Install Playwright browsers
        run: pnpm --filter "@floors/extension" exec playwright install chromium --with-deps
        working-directory: floors

      - name: Start services
        run: |
          NODE_ENV=local PORT=3001 SERVICE_NAME=api \
            DATABASE_URL=postgres://floors:floors@localhost:5432/floors_api \
            RELAYER_URL=http://localhost:3002 \
            node floors/services/api/dist/index.js &
          NODE_ENV=local PORT=3002 SERVICE_NAME=relayer \
            DATABASE_URL=postgres://floors:floors@localhost:5432/floors_relayer \
            NEAR_NODE_URL=http://localhost:3030 \
            NEAR_NETWORK_ID=sandbox \
            node floors/services/relayer/dist/index.js &
          sleep 5

      - name: Verify service health
        run: |
          curl -sf http://localhost:3001/health
          curl -sf http://localhost:3002/health

      - name: Run E2E smoke test
        run: CI=true pnpm --filter "@floors/extension" exec playwright test e2e/smoke-buy.spec.ts
        working-directory: floors
        env:
          CI: true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: floors/apps/extension/test-results/
          retention-days: 7
