version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: floors
      POSTGRES_PASSWORD: floors
      POSTGRES_DB: floors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floors"]
      interval: 5s
      timeout: 5s
      retries: 5

  near-sandbox:
    image: ghcr.io/near/sandbox:latest
    platform: linux/amd64
    ports:
      - "3030:3030"
    volumes:
      - near_sandbox_data:/root/.near
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -f /root/.near/node_key.json ]; then
          near-sandbox --home /root/.near init --chain-id localnet;
        fi;
        exec near-sandbox --home /root/.near run
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mock-solver:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./infra/mock-solver:/app
    ports:
      - "4040:4040"
    command: >
      sh -c "npm install --silent && node --import tsx/esm index.ts"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4040 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  near_sandbox_data:
