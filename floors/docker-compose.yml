version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: floors
      POSTGRES_PASSWORD: floors
      POSTGRES_DB: floors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floors"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
