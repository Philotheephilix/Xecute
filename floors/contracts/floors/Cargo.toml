[package]
name = "floors"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# When compiling for wasm (on-chain), use near-sdk without extra features.
[target.'cfg(target_family = "wasm")'.dependencies]
near-sdk = "=5.24.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
floors-types = { path = "../floors-types" }

# When compiling for the host (tests, checks, IDE).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
near-sdk = { version = "=5.24.1", features = ["unit-testing"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
floors-types = { path = "../floors-types" }

[dev-dependencies]
near-sdk = { version = "=5.24.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.3-rust-1.85.1"
image_digest = "sha256:placeholder"
container_build_command = ["cargo", "near", "build", "non-docker"]
