[package]
name = "mock-pyth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_family = "wasm")'.dependencies]
near-sdk = "5.11.0"
serde = { version = "1.0.219", features = ["derive"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
near-sdk = { version = "5.11.0", features = ["non-contract-usage"] }
serde = { version = "1.0.219", features = ["derive"] }
