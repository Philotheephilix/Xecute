<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>X Post with $ETH (v2 DOM) — Floors Fixture</title>
    <style>
      body { font-family: -apple-system, sans-serif; background: #000; margin: 0; padding: 16px; color: #e7e9ea; }
      article { border: 1px solid #2f3336; border-radius: 0; padding: 12px 16px; max-width: 600px; }
      .tweet-text { font-size: 15px; line-height: 1.4; }
      .tweet-text a { color: #1d9bf0; text-decoration: none; }
      .tweet-text a span { color: inherit; }
    </style>
  </head>
  <body>
    <!--
      Mimics X.com's CURRENT DOM (2024+):
      - article with role="article" (no data-testid="tweet")
      - Cashtags rendered as <a> wrapping <span> with just "$ETH" text
      - No data-testid="cashtag" attribute
      - No cashtag_click in href — may have no href at all, or a /search href
    -->
    <article role="article" tabindex="0">
      <div class="tweet-text">
        <span>Ethereum just surpassed 1 million validators. The Pectra upgrade shipped cleanly.</span>
        <a role="link" href="/search?q=%24ETH"><span>$ETH</span></a>
        <span>is the hardest money in DeFi. Accumulate every dip.</span>
      </div>
      <a href="/cryptoanalyst/status/1234567890" style="font-size:12px;color:#71767b;">
        Nov 13, 2026
      </a>
    </article>
  </body>
</html>
