[package]
name = "floors-types"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_family = "wasm")'.dependencies]
near-sdk = "5.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
schemars = "0.8.22"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
near-sdk = { version = "5.11.0", features = ["non-contract-usage"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
schemars = "0.8.22"
